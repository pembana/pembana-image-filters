name: Java CI with Maven
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:
    inputs:
      release-artifact-id:
        type: string
      release-tag:
        type: string
      release-revision:
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/checkout-release
      if: inputs.release-artifact-id != ''
      with:
        artifact-id: ${{ inputs.release-artifact-id }}
        tag: ${{ inputs.release-tag }}
        revision: ${{ inputs.release-revision }}
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'liberica'
        cache: maven
    - name: Build with Maven
      run: ./mvnw --batch-mode --no-transfer-progress clean verify
