name: release
on:
  workflow_dispatch:
    inputs:
      release-version:
        description: Release version (for example, 1.0.0-M2)
        required: true
        type: string
      next-snapshot-version:
        description: Next development version including -SNAPSHOT (for example, 1.0.0-SNAPSHOT)
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.release-version }}
      NEXT_SNAPSHOT_VERSION: ${{ inputs.next-snapshot-version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate versions
        shell: bash
        run: |
          version_pattern='[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?'
          shopt -s nocasematch
          if [[ ! "$RELEASE_VERSION" =~ ^${version_pattern}$ ||
                "$RELEASE_VERSION" == *-SNAPSHOT ||
                "$RELEASE_VERSION" =~ -[0-9]{8}\.[0-9]{6}-[0-9]+$ ]]; then
            echo "::error::Enter a release version such as 1.0.0-M2."
            exit 1
          fi
          shopt -u nocasematch
          if [[ ! "$NEXT_SNAPSHOT_VERSION" =~ ^${version_pattern}-SNAPSHOT$ ]]; then
            echo "::error::Enter a next version ending in -SNAPSHOT, such as 1.0.0-SNAPSHOT."
            exit 1
          fi
          echo "RELEASE_TAG=v$RELEASE_VERSION" >> "$GITHUB_ENV"
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'liberica'
          cache: maven
      - name: Prepare release commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ./mvnw -B --no-transfer-progress -Pversions versions:set \
            -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false

          # A retry must use the same commit if the previous run pushed a tag.
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            release_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
            if [[ "$(git rev-parse "$release_commit^")" != "$GITHUB_SHA" ]] ||
               ! git diff --quiet "$release_commit" --; then
              echo "::error::The release tag already points to a different release commit."
              exit 1
            fi
            git restore -- pom.xml
            git switch --detach "$release_commit"
            echo "RESUMING_RELEASE=true" >> "$GITHUB_ENV"
          else
            git add pom.xml
            git commit -m "Releasing version $RELEASE_VERSION"
            git tag -a "$RELEASE_TAG" -m "$RELEASE_VERSION"
          fi
      - name: Build and stage artifacts
        run: ./mvnw -B --no-transfer-progress -Ppublication clean deploy
      - name: Push release tag
        shell: bash
        run: |
          remote_main=$(git ls-remote --exit-code origin refs/heads/main)
          if [[ "${remote_main%%$'\t'*}" != "$GITHUB_SHA" ]]; then
            echo "::error::Main advanced after dispatch. Start the release from the current main."
            exit 1
          fi
          git push origin "refs/tags/$RELEASE_TAG"
      - name: Publish to Maven Central
        shell: bash
        env:
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.JRELEASER_MAVENCENTRAL_PASSWORD }}
        run: |
          if [[ "${RESUMING_RELEASE:-false}" == true ]]; then
            artifact_path="com/pembana/imaging/pembana-image-filters/$RELEASE_VERSION/pembana-image-filters-$RELEASE_VERSION.pom"
            published_pom="$RUNNER_TEMP/published-release.pom"
            status=$(curl --silent --show-error --location --retry 3 \
              --output "$published_pom" --write-out '%{http_code}' \
              "https://repo.maven.apache.org/maven2/$artifact_path")
            case "$status" in
              200)
                if ! cmp -s "$published_pom" "target/staging-deploy/$artifact_path"; then
                  echo "::error::Maven Central already has a different POM for this version."
                  exit 1
                fi
                echo "This release is already published to Maven Central."
                exit 0
                ;;
              404) ;; # Continue with publishing.
              *)
                echo "::error::Could not check Maven Central (HTTP $status)."
                exit 1
                ;;
            esac
          fi
          ./mvnw -B --no-transfer-progress jreleaser:deploy \
            -Dmaven-central.active=RELEASE \
            -Djreleaser.output.directory="$PWD/target/jreleaser/deploy"
      - name: Publish GitHub release
        env:
          JRELEASER_GITHUB_TOKEN: ${{ github.token }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
        run: |
          ./mvnw -B --no-transfer-progress jreleaser:release \
            -Djreleaser.skip.tag=true -Djreleaser.update=true \
            -Djreleaser.tag.name="$RELEASE_TAG" \
            -Djreleaser.output.directory="$PWD/target/jreleaser/release"
      - name: Commit next snapshot
        run: |
          ./mvnw -B --no-transfer-progress -Pversions versions:set \
            -DnewVersion="$NEXT_SNAPSHOT_VERSION" -DgenerateBackupPoms=false
          git add pom.xml
          git commit -m "Next development version $NEXT_SNAPSHOT_VERSION"
          git push origin HEAD:refs/heads/main
      - name: JReleaser release output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jreleaser-release
          path: |
            target/jreleaser/*/trace.log
            target/jreleaser/*/output.properties
